name: Mirror original ChatGPT Site to GitHub Pages

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-original-site.yml'

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Mirror original ChatGPT Site
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN='https://social-service-ai-toolkit.cqrgjcp7wz.chatgpt.site'
          HOST='social-service-ai-toolkit.cqrgjcp7wz.chatgpt.site'
          rm -rf /tmp/mirror /tmp/site
          mkdir -p /tmp/mirror /tmp/site

          wget --quiet --mirror --page-requisites --convert-links --adjust-extension \
            --no-parent --execute robots=off "$ORIGIN/" -P /tmp/mirror
          cp -a "/tmp/mirror/$HOST/." /tmp/site/

          cat > /tmp/assets.txt <<'EOF'
          appscript/step-1-thumb.webp
          appscript/step-1.webp
          appscript/step-2-thumb.webp
          appscript/step-2.webp
          appscript/step-3-thumb.webp
          appscript/step-3.webp
          appscript/step-4-thumb.webp
          appscript/step-4.webp
          appscript/step-5-thumb.webp
          appscript/step-5.webp
          demo/cantonese-tts/cantonese-voice-example.mp4
          demo/cantonese-tts/canva-ai-voice.jpeg
          demo/cantonese-tts/capcut-text-to-speech.jpeg
          demo/cantonese-tts/minimax-audio-cantonese.jpeg
          demo/cantonese-tts/step-by-step/adding-cantonese-line-by-line.mp4
          demo/cantonese-tts/step-by-step/poster.jpg
          demo/canva-image-to-video/fathers-day-result.mp4
          demo/canva-image-to-video/result.jpeg
          demo/canva-image-to-video/settings.jpeg
          demo/canva-presentation/slide-01.png
          demo/canva-presentation/slide-02.png
          demo/canva-presentation/slide-03.png
          demo/canva-presentation/slide-04.png
          demo/canva-presentation/slide-05.png
          demo/canva-presentation/slide-06.png
          demo/canva-presentation/slide-07.png
          demo/canva-presentation/slide-08.png
          demo/canva-presentation/slide-09.png
          demo/canva-presentation/slide-10.png
          demo/canva-presentation/canva-ai-prompt.png
          demo/canva-presentation/psychodynamic-cover.png
          demo/canva-presentation/psychodynamic-introduction.pdf
          demo/canva-text-to-video/family-tea-result.mp4
          demo/canva-text-to-video/prompt-and-result.jpeg
          demo/gemini-srt-output.png
          demo/gotranscript-subtitle-converter.png
          demo/grok/fathers-day-result.mp4
          demo/grok/fathers-day-source.jpeg
          demo/grok/image-to-video-prompt.jpeg
          demo/grok/imagine-settings.jpeg
          demo/no-prompt-image-to-video/savanna-result.mp4
          demo/no-prompt-image-to-video/savanna-source.png
          demo/notebooklm-parenting-source.png
          demo/notebooklm-parenting-video.png
          demo/notebooklm-source-to-slides.png
          demo/notebooklm-youtube-source.png
          demo/srt-workflow/01-gemini-timeline.jpeg
          demo/srt-workflow/02-srt-file.jpeg
          demo/srt-workflow/03-capcut-import.jpeg
          demo/srt-workflow/04-capcut-subtitle-timing.jpeg
          demo/srt-workflow/final-captioned-video.mp4
          examples/tong-lok-chatgpt.png
          examples/tong-lok-gemini.png
          examples/tong-lok-grok.jpeg
          favicon.svg
          file.svg
          globe.svg
          interfaces/chatgpt-interface.png
          interfaces/copilot-interface.png
          interfaces/gemini-interface.png
          interfaces/grok-interface.jpeg
          interfaces/notebooklm-interface.png
          window.svg
          EOF

          while IFS= read -r asset; do
            [ -n "$asset" ] || continue
            mkdir -p "/tmp/site/$(dirname "$asset")"
            echo "Downloading $asset"
            if ! curl --fail --location --retry 2 --retry-delay 1 --silent --show-error \
              "$ORIGIN/$asset" -o "/tmp/site/$asset"; then
              echo "WARNING: unavailable on current public site: $asset"
              rm -f "/tmp/site/$asset"
            fi
          done < /tmp/assets.txt

          python3 - <<'PY'
          from pathlib import Path
          root = Path('/tmp/site')
          prefixes = ('appscript','demo','examples','interfaces','_next','assets')
          for p in root.rglob('*'):
              if not p.is_file():
                  continue
              try:
                  data = p.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              original = data
              for prefix in prefixes:
                  data = data.replace(f'"/{prefix}/', f'"/social-service-ai-toolkit/{prefix}/')
                  data = data.replace(f"'/{prefix}/", f"'/social-service-ai-toolkit/{prefix}/")
                  data = data.replace(f'url(/{prefix}/', f'url(/social-service-ai-toolkit/{prefix}/')
              data = data.replace('href="/favicon.svg"', 'href="/social-service-ai-toolkit/favicon.svg"')
              if data != original:
                  p.write_text(data, encoding='utf-8')
          PY

          # iPad/Safari compatibility: the original desktop workspace uses a
          # nested fixed-height sidebar. On GitHub Pages this can create a
          # second scroll container. For tablet widths, keep the original
          # visual system but use one natural page scroll and expose the whole
          # 01–08 route continuously.
          CSS_FILE="$(find /tmp/site/assets -maxdepth 1 -type f -name 'index-*.css' | head -n 1)"
          if [ -n "$CSS_FILE" ]; then
            cat >> "$CSS_FILE" <<'EOF'
          @media (min-width:900px) and (max-width:1400px){
            html,body{height:auto!important;min-height:100%!important;overflow-x:hidden!important;overflow-y:auto!important}
            .site-header{position:sticky!important;top:0!important;overflow-x:auto!important;-webkit-overflow-scrolling:touch}
            .site-header .desktop-nav{display:flex!important;min-width:max-content}
            .desktop-workspace{display:block!important;min-height:0!important}
            .workspace-sidebar{display:none!important;position:static!important;height:auto!important;overflow:visible!important}
            .workspace-current-view{display:none!important;position:static!important}
            .workspace-content{display:block!important;min-height:0!important;overflow:visible!important}
            .workspace-content>[data-workspace-module]{display:block!important}
            .workspace-content>.hero,.workspace-content>.section,.workspace-content>.workflow-section,.workspace-content>.safety-section,.workspace-content>.tool-guide-section,.workspace-content>.ai-developments-section,.workspace-content>.workflow-map-section,.workspace-content>.workbench-section{scroll-margin-top:86px}
          }
          EOF
          fi

          rm -rf _next assets appscript demo examples interfaces
          find . -maxdepth 1 -type f ! -name '.gitignore' -delete
          cp -a /tmp/site/. .
          touch .nojekyll

      - name: Verify mirrored site
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s demo/srt-workflow/final-captioned-video.mp4
          test -s interfaces/chatgpt-interface.png
          grep -q '08' index.html
          echo "Mirrored files: $(find . -type f | wc -l)"
          echo "Mirrored size: $(du -sh . | cut -f1)"

      - name: Commit mirrored site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No mirrored changes to commit.'
          else
            git commit -m 'Mirror original ChatGPT Site with iPad compatibility'
            git push
          fi
