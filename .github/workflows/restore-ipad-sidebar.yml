name: Restore iPad sidebar after mirror

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-ipad-sidebar.yml'
  workflow_run:
    workflows:
      - "Mirror original ChatGPT Site to GitHub Pages"
    types:
      - completed

permissions:
  contents: write

jobs:
  restore-sidebar:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Keep iPad sidebar permanently visible
        shell: bash
        run: |
          set -euo pipefail
          CSS_FILE="$(find assets -maxdepth 1 -type f -name 'index-*.css' | head -n 1)"
          test -n "$CSS_FILE"

          if ! grep -q 'IPAD-SIDEBAR-PERSIST-V2' "$CSS_FILE"; then
            cat >> "$CSS_FILE" <<'EOF'

/* IPAD-SIDEBAR-PERSIST-V2 */
@media (min-width:760px) and (max-width:1400px){
  html{scroll-behavior:auto!important;overflow-anchor:none!important}
  html,body{height:auto!important;min-height:100%!important;overflow-x:hidden!important}
  body{overflow-y:visible!important;position:static!important}

  .site-header{position:sticky!important;top:0!important;z-index:30!important;overflow:visible!important}
  .site-header .desktop-nav{display:none!important}

  .desktop-workspace{
    display:grid!important;
    grid-template-columns:280px minmax(0,1fr)!important;
    align-items:start!important;
    width:100%!important;
    min-height:0!important;
    overflow:visible!important;
  }

  .workspace-sidebar{
    display:flex!important;
    position:sticky!important;
    top:72px!important;
    align-self:start!important;
    height:calc(100dvh - 72px)!important;
    max-height:calc(100dvh - 72px)!important;
    overflow-y:auto!important;
    overflow-x:hidden!important;
    -webkit-overflow-scrolling:touch!important;
    z-index:18!important;
  }

  .workspace-current-view{
    display:grid!important;
    position:sticky!important;
    top:72px!important;
    z-index:20!important;
  }

  .workspace-content{
    display:block!important;
    min-width:0!important;
    min-height:0!important;
    height:auto!important;
    overflow:visible!important;
    position:relative!important;
  }

  .workspace-content>[data-workspace-module]{
    position:relative!important;
    overflow:visible!important;
  }
}
EOF
          fi

      - name: Commit sidebar fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/index-*.css
          if git diff --cached --quiet; then
            echo 'No sidebar changes to commit.'
          else
            git commit -m 'Restore permanent iPad left sidebar'
            git push
          fi
